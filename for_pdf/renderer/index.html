<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 테이블 캔버스</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header id="toolbar">
    <div id="brand"><span class="brand-mark">P</span><div><strong>PDF Table Picker</strong><span>PDF 표 수집 작업대</span></div></div>
    <div id="primary-actions">
      <button id="btn-load" class="btn btn-primary" title="PDF 폴더 다시 읽기 (Ctrl+O)">PDF 불러오기</button>
      <button id="btn-export" class="btn btn-success" disabled title="선택한 표를 Excel로 저장 (Ctrl+S)">Excel 내보내기</button>
    </div>
    <div id="view-actions" aria-label="캔버스 보기 조절">
      <button id="btn-zoom-out" class="icon-btn" title="축소">−</button>
      <button id="zoom-label" class="zoom-label" title="100%로 되돌리기">100%</button>
      <button id="btn-zoom-in" class="icon-btn" title="확대">＋</button>
      <button id="btn-fit" class="btn btn-subtle" title="모든 PDF를 화면에 맞춤 (F)">전체 맞춤</button>
    </div>
    <button id="btn-selection-panel" class="selection-pill" aria-expanded="true">선택한 표 <strong id="selection-count">0</strong></button>
  </header>
  <div id="canvas-viewport"><div id="canvas-world"></div></div>
  <aside id="selection-panel">
    <div class="panel-header"><div><span class="eyebrow">SELECTIONS</span><h2>선택 현황</h2></div><button id="btn-panel-close" class="icon-btn">×</button></div>
    <div id="selection-summary" class="selection-summary">PDF를 불러오고 원하는 표 영역을 드래그하세요.</div>
    <div id="selection-list" class="selection-list"></div>
    <div class="panel-footer"><button id="btn-clear" class="btn btn-danger" disabled>선택 초기화</button><p>표 오른쪽 위 번호로 같은 항목끼리 묶을 수 있습니다.</p></div>
  </aside>
  <div id="empty-state">
    <div class="empty-icon">▤</div><h1>PDF 표를 한 화면에서 비교하세요</h1>
    <p><code>pdf</code> 폴더의 파일을 이름순으로 펼친 뒤, 원하는 표 영역을 드래그해 Excel로 모을 수 있습니다.</p>
    <button id="btn-empty-load" class="btn btn-primary">PDF 불러오기</button>
    <div class="shortcut-row"><span>빈 곳 드래그로 이동</span><span>휠로 확대·축소</span><span>PDF 위 드래그로 선택</span></div>
  </div>
  <div id="canvas-status" class="hidden"><span id="report-count">0개 PDF</span><span>•</span><span>빈 곳을 드래그해 이동</span></div>
  <div id="toast" role="status" class="hidden"></div>
  <div id="loading-overlay" class="hidden"><div id="loading-box"><div class="spinner"></div><p id="loading-text">PDF를 분석하는 중...</p></div></div>
  <script src="index.js"></script>
</body>
</html>
