<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>DART 보고서 캔버스</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="toolbar"><strong>DART 보고서 캔버스</strong><button id="toggle-panel">목록 접기</button><button id="align">나란히 정렬</button><button id="asc">기간 ↑</button><button id="desc">기간 ↓</button><span class="zoom"><button id="zoom-out">−</button><b id="zoom-value">100%</b><button id="zoom-in">+</button><button id="zoom-reset">100%</button></span><span id="count">0개</span><span class="refresh-area"><button id="refresh" title="배치·크기·배율과 사이트 진행 상태를 초기화합니다">1.5초 눌러 새로고침</button></span></div><div class="hint">빈 공간 드래그: 캔버스 이동 · 제목 표시줄 드래그: 보고서 이동 · 오른쪽 아래: 크기 조절</div><div id="error" role="alert" hidden></div></header>
<aside id="sidebar"><nav class="sidebar-tabs"><button id="reports-tab" class="active">보고서 목록</button><button id="selections-tab">선택 표 <span id="selection-total">0</span></button></nav><div id="reports-panel"><div class="list-heading">보고서 목록<div class="target-actions"><button id="target-all">전체 선택</button><button id="target-none">선택 해제</button></div><div id="search-summary" role="status" aria-live="polite">적용 대상 0개</div></div><form id="table-search-form" hidden><strong>기준 표 검색 조건</strong><div id="reference-path"></div><div id="reference-preview"></div><label>세부 구간명<input id="table-section" maxlength="120" placeholder="예: 유형자산" required></label><label>필수 문구 (한 줄에 하나, 모두 포함)<textarea id="table-keywords" rows="3" placeholder="감가상각비&#10;기초&#10;기말" required></textarea></label><div id="keyword-choices"></div><div class="search-actions"><button type="button" id="save-table-options">조건 저장</button><button type="submit" id="run-table-search">선택한 보고서에서 찾기</button></div><small>검색 기준은 보라색, 후보는 파란색입니다. 엑셀 대상은 표 선택 ON으로 별도 선택하세요.</small></form><div id="report-list"></div></div><div id="selections-panel" hidden><div class="selection-toolbar"><button id="export-selections">선택 표 엑셀 저장</button><div id="selection-message" role="status"></div><small>초록색: 선택 표 · G번호는 연도별 순번<br>종료·목록 새로고침 시 선택은 초기화됩니다.</small></div><div id="selection-list"></div></div></aside><div id="splitter" role="separator" aria-label="목록 폭 조절"></div><div id="horizontal-scroll" class="canvas-scroll"><div id="horizontal-space"></div></div><div id="vertical-scroll" class="canvas-scroll"><div id="vertical-space"></div></div><main id="background"><div id="empty">보고서를 불러오는 중입니다.</div></main><script src="renderer.js"></script></body></html>
