<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><link rel="stylesheet" href="style.css"></head><body class="card">
<div id="card-header"><div class="report-label"><strong id="company"></strong><span id="date"></span></div><div id="title"></div><span id="status">대기 중</span><button id="retry">다시 열기</button><button id="apply-size">이 크기를 전체에 적용</button></div>
<div id="card-error" hidden></div><footer><div class="review-controls"><button id="manual-select">표 선택 OFF</button><button id="pick-table">검색 기준 선택</button><button id="search-table" hidden>이 표로 검색</button><button id="table-accept" hidden>합격</button><button id="table-reject" hidden>불합격·다음 표</button><button id="table-retry" hidden>후보 다시 표시</button><button id="table-rescan" hidden>현재 구간에서 검색</button><button id="table-broad" hidden>현재 구간 전체 검색</button></div><div id="review-result" role="status"></div><div class="card-size"><span id="dimensions"></span><span id="selected-count"></span><span id="handle" title="드래그하여 크기 조절">◢</span></div></footer><script src="card.js"></script></body></html>
