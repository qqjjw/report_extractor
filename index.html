<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DART · 로컬 탐색</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside id="leftPanel" class="panel left-panel">
 <div class="panel-top"><b>보고서</b><button id="toggleLeft" aria-label="보고서 패널 접기/펼치기">‹</button></div>
 <div class="panel-body">
  <div class="eyebrow">PERSONAL / RETRIEVAL LAB</div><h1>DART 캔버스</h1><p>보고서를 누르면 그 위치로 이동합니다.</p>
  <section class="report-panel"><div class="panel-heading"><b>보고서 목록</b><select id="sortDirection" aria-label="접수일 정렬"><option value="desc">접수일 내림차순 ↓</option><option value="asc">접수일 오름차순 ↑</option></select></div><div id="reportList"></div></section>
 </div><div class="panel-resizer" id="resizeLeft" title="보고서 패널 너비 조절"></div>
</aside>
<main>
 <nav><div><b>작업 보드</b><span id="reportCount"></span></div><div class="tools"><span>캔버스</span><button id="canvasMinus" aria-label="캔버스 축소">−</button><button id="canvasRatio" title="100%로 복원">60%</button><button id="canvasPlus" aria-label="캔버스 확대">+</button><button id="reload" title="1초 동안 누르면 reports.json을 다시 읽습니다"><i></i><span>보고서 다시 불러오기 · 1초 누르기</span></button></div></nav>
 <div id="viewport"><div id="board"></div></div>
 <footer><span>제목: 이동 · 테두리: 크기 · Ctrl+휠: 캔버스 / 사이트 확대</span><span id="position"></span></footer>
</main>
<aside id="rightPanel" class="panel right-panel">
 <div class="panel-top"><b>탐색</b><button id="toggleRight" aria-label="탐색 패널 접기/펼치기">›</button></div>
 <div class="panel-body">
 <p id="activeReport">보고서를 선택하세요.</p>
 <section class="source-panel"><div class="source-tools"><button id="selectSource">기준 표 선택</button><button id="clearSource" class="secondary">해제</button></div><p id="sourceStatus">파랑: 기준 표 · 주황: 검색 결과</p><button id="showSource" class="secondary" hidden>기준 표로 이동</button></section>
 <form id="search">
  <label for="indexQuery">어디에서 · 목차 INDEX</label><input id="indexQuery" value="부문별 보고 (연결)">
  <label for="query">무엇을 · 공백은 AND</label><input id="query" value="매출액 영업이익">
  <div class="searchline"><label for="k">최대 후보 K</label><input id="k" type="number" min="1" max="5" value="5"></div>
  <button class="primary" id="run">선택한 보고서에서 찾기 →</button>
 </form>
 <div id="status" class="status">보고서를 여는 중입니다.</div><div id="results"></div>
 <section><h2>선택한 표 · 검색 후에도 유지</h2><input id="selectionGroup" placeholder="표 종류: 주식 수 / 직원 수" aria-label="선택 표 종류"><button id="keepSource" class="mini secondary">기준 표를 목록에 추가</button><div id="selections"></div></section>
 <h2>탐색 기록</h2><small>원문 전체는 로그에 저장하지 않습니다.</small><div id="logs" class="logs"></div>
 </div><div class="panel-resizer" id="resizeRight" title="탐색 패널 너비 조절"></div>
</aside>
<div id="dragShield" hidden></div>
<script src="renderer.js"></script>
</body></html>
